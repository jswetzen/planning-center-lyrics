[project]
name = "planning-center-lyrics"
version = "0.1.0"
description = "Export song lyrics from a Planning Center Services plan to Markdown, a static HTML page, or a live remote/wall display."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
]

# `pco_client` (src/pco_client/) is the only real package here -- everything
# else is standalone scripts in notion-export/, static-site/, and
# experimental/ that import it as `from pco_client import ...`. Installing
# it via `uv sync` (editable, into .venv) is what makes that import resolve
# regardless of which subfolder the script runs from.
[build-system]
requires = ["uv_build>=0.9.11,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pco_client"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

# scheduler.py lives in static-site/ (a standalone-scripts dir, not a package
# under src/) -- add it to pythonpath so tests can `import scheduler` without
# a conftest.py hack. pco_client is already importable via the editable
# project install uv sync performs.
[tool.pytest.ini_options]
pythonpath = ["static-site"]
