# Single-container deployment: one Flask app serves the public lyrics page
# ("/") and the Basic Auth-gated admin UI ("/admin") that regenerates the
# site from Planning Center and toggles it open/closed. See README.md's
# "Containerized deployment" section.
#
# Pulls the prebuilt image published by .github/workflows/docker-build.yml on
# every push to main, rather than building locally -- keeps this in sync with
# the same image the mikro-iac deployment runs (apps/poc-lyrics.nix). If
# you're iterating on the Dockerfile/app code itself, build it directly
# instead (`podman build -f Dockerfile -t planning-center-lyrics ..` from
# this directory) and point `image:` below at that tag temporarily.
#
# Usage (rootless podman, from this directory):
#   podman compose pull && podman compose up -d
#   # or, if your podman doesn't bundle compose: podman-compose pull && podman-compose up -d

services:
  app:
    image: ghcr.io/jswetzen/planning-center-lyrics:main
    pull_policy: always
    env_file:
      - ../.env
    volumes:
      - site-data:/data
    ports:
      - "9000:9000"
    restart: unless-stopped

volumes:
  site-data:
