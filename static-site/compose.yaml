# Single-container deployment: one Flask app serves the public lyrics page
# ("/") and the Basic Auth-gated admin UI ("/admin") that regenerates the
# site from Planning Center and toggles it open/closed. See README.md's
# "Containerized deployment" section.
#
# Build context is the repo root (".."), not this directory -- the
# Dockerfile needs pyproject.toml/uv.lock/src/ from up there.
#
# Usage (rootless podman, from this directory):
#   podman compose up --build -d
#   # or, if your podman doesn't bundle compose: podman-compose up --build -d

services:
  app:
    build:
      context: ..
      dockerfile: static-site/Dockerfile
    env_file:
      - ../.env
    volumes:
      - site-data:/data
    ports:
      - "9000:9000"
    restart: unless-stopped

volumes:
  site-data:
